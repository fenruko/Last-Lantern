[package]
name = "last-lantern"
version = "0.1.0"
edition = "2021"
description = "A handcrafted pixel-art action adventure for Linux"
license = "MIT"

[dependencies]
minifb = "=0.27.0"
pathfinding = "=4.9.1"
png = "=0.17.13"
libc = "=0.2.155"
rodio = { version = "=0.19.0", optional = true }

[features]
default = ["audio"]
audio = ["dep:rodio"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
